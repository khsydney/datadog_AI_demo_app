# k8s/01-secrets.yaml
# Replace placeholders and apply. Do NOT commit the populated file.
#
#   cp k8s/01-secrets.yaml /tmp/secrets.yaml
#   # edit values…
#   kubectl apply -f /tmp/secrets.yaml
#
# Or use the helper script:    scripts/seed-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: chat-llm-rag
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME_OPENAI_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: datadog-secrets
  namespace: chat-llm-rag
type: Opaque
stringData:
  DD_API_KEY: "REPLACE_ME_DATADOG_API_KEY"
  # AI Guard needs an Application Key with the ai_guard_evaluate scope.
  DD_APP_KEY: "REPLACE_ME_DATADOG_APP_KEY"
