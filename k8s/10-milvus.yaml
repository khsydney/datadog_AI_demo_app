# k8s/10-milvus.yaml
# Milvus standalone needs etcd (metadata) and minio (object store).
# This is a straight translation of docker/milvus-compose.yaml.
# All three speak inside the namespace; only milvus:19530 is consumed by the app.

# ───────────────────────────── etcd ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: chat-llm-rag
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: chat-llm-rag
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
        tags.datadoghq.com/service: etcd
        tags.datadoghq.com/env: demo
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.18
          command:
            - etcd
            - "-advertise-client-urls=http://etcd:2379"
            - "-listen-client-urls=http://0.0.0.0:2379"
            - "--data-dir=/etcd"
          env:
            - { name: ETCD_AUTO_COMPACTION_MODE,      value: "revision" }
            - { name: ETCD_AUTO_COMPACTION_RETENTION, value: "1000" }
            - { name: ETCD_QUOTA_BACKEND_BYTES,       value: "4294967296" }
            - { name: ETCD_SNAPSHOT_COUNT,            value: "50000" }
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /etcd
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
        storageClassName: gp3

# ───────────────────────────── MinIO ───────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: chat-llm-rag
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: chat-llm-rag
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        tags.datadoghq.com/service: minio
        tags.datadoghq.com/env: demo
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ["server", "/minio_data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER,     value: "minioadmin" }
            - { name: MINIO_ROOT_PASSWORD, value: "minioadmin" }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /minio_data
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        storageClassName: gp3

# ───────────────────────────── Milvus standalone ───────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: chat-llm-rag
spec:
  selector:
    app: milvus
  ports:
    - name: grpc
      port: 19530
    - name: health
      port: 9091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  namespace: chat-llm-rag
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
        tags.datadoghq.com/service: milvus
        tags.datadoghq.com/env: demo
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z etcd 2379 && nc -z minio 9000; do echo waiting; sleep 2; done"]
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.6.0
          args: ["milvus", "run", "standalone"]
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - { name: ETCD_ENDPOINTS, value: "etcd:2379" }
            - { name: MINIO_ADDRESS,  value: "minio:9000" }
            - { name: MQ_TYPE,        value: "woodpecker" }
          ports:
            - containerPort: 19530
            - containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        storageClassName: gp3
