# k8s/01-pvc.yaml
# 5Gi EBS volume shared by rag-api (uploads land here, reindex reads from here).
# ReadWriteOnce because EBS — rag-api must be 1 replica (it already is).
# If you scale rag-api > 1 later, swap to EFS / ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docs-pvc
  namespace: chat-llm-rag
  labels:
    app: rag-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Uses the cluster default StorageClass.
  # On your EKS cluster that's `gp2` (the EBS CSI default) unless you
  # made another one default. Verify with: kubectl get storageclass
